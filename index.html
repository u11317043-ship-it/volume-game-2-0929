<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09｜聲音小怪獸</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#203e46;background:#f4f2ec;line-height:1.65}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1350px;margin:auto;padding:24px}
h1{font-size:34px;margin:5px 0}
h2{font-size:20px;margin:0 0 12px}
p{margin:8px 0}
.small,small{font-size:13px;color:#526b70}
.eyebrow{font-size:12px;letter-spacing:.12em;color:#526b70}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;margin-top:20px;align-items:start}
.stage{background:#e9f1ec;border-radius:18px;overflow:hidden;border:1px solid #ccd9d4;position:sticky;top:16px;min-width:0}
.stage canvas{display:block;width:100%;aspect-ratio:3/2}
.caption{margin:0;background:white;padding:14px 18px;min-height:3em}
.panel{background:white;border:1px solid #ccd9d4;border-radius:16px;padding:20px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button,select{font:inherit;padding:8px 12px;border:1px solid #286a5c;border-radius:8px}
button{background:#286a5c;color:white;cursor:pointer}
button.secondary,select{background:white;color:#203e46}
select{width:100%}
button:disabled,input:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:14px;font-weight:bold;margin-top:12px}
input[type=range]{width:100%;accent-color:#286a5c}
output{float:right}
:focus-visible{outline:3px solid #b46a25;outline-offset:3px}
.meter{height:18px;background:#e4ebe5;border-radius:5px;position:relative;margin:12px 0}
.fill{height:100%;background:#5e9a85;width:0;border-radius:5px;transition:background-color 0.1s}
.fill.over-limit{background:#d93838}
.line{position:absolute;top:-3px;height:24px;border-left:3px solid #345778}
.line.sound{border-color:#9c5432}
.line.warning{border-color:#e74c3c;border-left-style:dashed}
.readings{background:#f0f4f0;border-radius:8px;padding:12px;margin:14px 0;font-size:14px}
.readings strong{font-size:22px}
summary{cursor:pointer;font-weight:bold}
details{margin:16px 0}
li{margin:7px 0}
body.play .debug-only{display:none!important}
body.play .layout{grid-template-columns:1fr;margin-top:0}
body.play .stage{position:static;max-width:1100px;width:100%;margin:auto}
body.play .stage canvas{max-height:85vh;object-fit:contain}
[hidden]{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.stage{position:static}main{padding:18px 14px}}
</style>
</head>
<body>
<main>
<header class="debug-only">
  <p class="eyebrow">互動教具 · 聲音改作進階版</p>
  <h1>聲音小怪獸</h1>
  <p>輕聲時探頭，聲音變大時會向下縮且變紅；超過 40% 音量時會發出警示提示音。</p>
  <p class="small">按下【空白鍵】切換除錯與遊戲模式；可選擇「真實麥克風」直接用語音操控！</p>
</header>
<div class="layout">
  <section class="stage" id="stage" tabindex="0" aria-label="聲音小怪獸互動區域">
    <canvas id="scene" role="img" aria-label="輕聲時探頭，聲音變大時下縮並變紅，超過40%發出提示音"></canvas>
    <p id="gameState" class="caption"></p>
  </section>
  <aside id="debug" class="panel debug-only">
    <h2>輸入與除錯</h2>
    <label for="input">音量來源</label>
    <select id="input">
      <option value="keyboard">鍵盤模擬：↑ 發聲，放開安靜</option>
      <option value="slider">滑桿模擬：持續指定音量</option>
      <option value="mic">真實麥克風</option>
    </select>
    <div class="buttons">
      <button id="start" disabled>啟用麥克風</button>
      <button id="stop" class="secondary" disabled>停止擷取</button>
    </div>
    <p id="status" class="small" role="status">目前使用鍵盤模擬，不需要麥克風。</p>
    <label for="keyLevel">按鍵／短促音量 <output id="keyLevelValue">65</output></label>
    <input id="keyLevel" type="range" min="0" max="100" value="65">
    <label for="sim">滑桿模擬音量 <output id="simValue">0</output></label>
    <input id="sim" type="range" min="0" max="100" value="0" disabled>
    <div class="buttons">
      <button id="pulse">短促一下</button>
      <button id="zero" class="secondary">模擬歸零</button>
      <button id="reset" class="secondary">重新開始</button>
    </div>
    <div class="readings">
      音量 <strong id="volume">0</strong>／100 · <span id="gateState">安靜</span><br>
      提示音狀態：<span id="alertState">正常</span><br>
      受驚次數：<span id="count">0</span>
    </div>
    <div class="meter">
      <div id="fill" class="fill"></div>
      <span class="line" id="quietLine" title="安靜門檻"></span>
      <span class="line sound" id="soundLine" title="發聲門檻"></span>
      <span class="line warning" style="left:40%" title="40% 提示音門檻"></span>
    </div>
    <label for="quiet">安靜門檻 <output id="quietValue">20</output></label>
    <input id="quiet" type="range" min="0" max="90" value="20">
    <label for="sound">發聲門檻 <output id="soundValue">40</output></label>
    <input id="sound" type="range" min="5" max="100" value="40">
    <label for="burst">突然聲響增幅 <output id="burstValue">12</output></label>
    <input id="burst" type="range" min="5" max="40" value="12">
    <button class="secondary" id="calibrate" disabled>測量背景音（3 秒）</button>
    <details open>
      <summary>玩法與改作說明</summary>
      <p class="small">1. 聲音越大，怪獸會逐漸下縮，且皮膚顏色會逐漸變紅。</p>
      <p class="small">2. 按【空白鍵】隨時切換除錯模式與全螢幕遊戲模式。</p>
      <p class="small">3. 當音量大於 40% 時，程式會發出提示音，提示音音量隨輸入音量大小而成正比變化。</p>
      <p class="small">4. 切換至「真實麥克風」即可啟用現場聲音驅動。</p>
    </details>
  </aside>
</div>
</main>

<script>
'use strict';
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const defaults={quiet:20,sound:40,gravity:120,lift:240,sensitivity:1,burst:12};

class VoiceControl{
 constructor(){this.reset();}
 reset(){this.sounding=false;this.smoothed=null;this.history=[];this.last=null;this.cooldown=-Infinity;this.burstReady=false;this.settledSince=null;}
 tick(raw,t,p){
  if(this.last!==null&&t-this.last>250)this.reset();
  const dt=this.last===null?0:Math.max(0,(t-this.last)/1000);this.last=t;
  this.smoothed=this.smoothed===null?raw:this.smoothed+(raw-this.smoothed)*(1-Math.exp(-dt/.065));
  this.history.push({t,v:raw});while(this.history.length>1&&this.history[1].t<=t-100)this.history.shift();
  const base=this.history[0],readyWindow=t-base.t>=80,rise=readyWindow?raw-base.v:0;
  if(this.smoothed>=p.sound)this.sounding=true;else if(this.smoothed<p.quiet)this.sounding=false;
  if(rise<p.burst*.3){if(this.settledSince===null)this.settledSince=t;if(t-this.settledSince>=150)this.burstReady=true;}else this.settledSince=null;
  let event=false;if(readyWindow&&this.burstReady&&raw>=p.sound&&rise>=p.burst&&t-this.cooldown>=600){event=true;this.cooldown=t;this.burstReady=false;this.settledSince=null;}
  const intensity=this.sounding?clamp((this.smoothed-p.quiet)/Math.max(5,p.sound-p.quiet),0,2):0;
  return {volume:this.smoothed,rise,event,sounding:this.sounding,force:p.lift*p.sensitivity*intensity,eventState:t-this.cooldown<600?'冷卻中':this.burstReady?'等待突然增幅':'等待音量穩定'};
 }
}

function makeGame(){return{state:'curious',quietSince:null,last:null,count:0,visible:.6,message:'輕聲呼喚我，聲音過大我會下縮變紅並躲起來。'};}
function pauseGame(g){g.quietSince=null;g.last=null;}
function updateGame(g,r,raw,dt,t){
  if(g.last!==null&&t-g.last>250)g.quietSince=null;
  g.last=t;
  if(r.event){g.state='scared';g.quietSince=null;g.count++;}
  if(g.state==='scared'){
    if(raw<params.quiet){
      if(g.quietSince===null)g.quietSince=t;
      if(t-g.quietSince>=2000){g.state='curious';g.quietSince=null;}
    }else g.quietSince=null;
  }else g.state=r.sounding?'peek':'curious';
  
  const target=g.state==='scared'?0:g.state==='peek'?1:.6;
  g.visible+=(target-g.visible)*(1-Math.exp(-dt*6));

  if(raw > 40){
    g.message = '警告：音量超過 40%！怪獸感到不安。';
  } else {
    g.message=g.state==='scared'?(g.quietSince===null?'嚇到了！請安靜兩秒，讓我安心。':'安靜等待 '+Math.min(2,(t-g.quietSince)/1000).toFixed(1)+'／2 秒'):g.state==='peek'?'聽見你了！持續輕聲，我會探頭。':'我在這裡，試著輕聲呼喚我。';
  }
}

// 繪製遊戲與動態怪獸（功能 1：隨音量下縮與變紅）
function drawGame(g, t, rawLevel){
  paint.fillStyle='#e8efe9';paint.fillRect(0,0,900,600);
  paint.fillStyle='#d1dfce';paint.beginPath();paint.ellipse(450,615,520,180,0,0,Math.PI*2);paint.fill();
  paint.fillStyle='#71816b';paint.beginPath();paint.ellipse(450,452,172,120,0,Math.PI,0);paint.lineTo(622,520);paint.lineTo(278,520);paint.closePath();paint.fill();
  paint.fillStyle='#283f38';paint.beginPath();paint.ellipse(450,455,120,96,0,0,Math.PI*2);paint.fill();
  
  paint.save();
  paint.beginPath();paint.rect(280,180,340,305);paint.clip();

  // 計算音量比例 (0 ~ 1)
  const soundRatio = clamp(rawLevel / 100, 0, 1);
  
  // 基礎高度 (1.0 代表完整探頭，0 代表隱藏)
  const baseY = 535 - g.visible * 165;
  
  // 功能 1：音量越大，怪獸壓扁下縮
  const squishY = 1 - soundRatio * 0.42; // Y軸壓縮最高達 42%
  const squishX = 1 + soundRatio * 0.28; // X軸擴張最高達 28%
  const offsetY = soundRatio * 45;       // 向下位移

  paint.translate(450, baseY + offsetY);
  paint.scale(squishX, squishY);

  // 功能 1：音量越大，皮膚顏色越紅 (綠色 #83b6a2 漸變至 鮮紅色)
  const redComp = Math.round(131 + (230 - 131) * soundRatio);
  const greenComp = Math.round(182 * (1 - soundRatio * 0.75));
  const blueComp = Math.round(162 * (1 - soundRatio * 0.75));
  const monsterColor = `rgb(${redComp},${greenComp},${blueComp})`;

  // 怪獸身體
  paint.fillStyle = monsterColor;
  paint.beginPath();
  paint.ellipse(0, 0, 76, 86, 0, 0, Math.PI * 2);
  paint.fill();

  // 耳朵
  for(const x of [-39, 39]){
    paint.beginPath();
    paint.ellipse(x, -69, 17, 31, x < 0 ? -0.4 : 0.4, 0, Math.PI * 2);
    paint.fill();
  }

  // 眼睛
  for(const x of [-28, 28]){
    paint.fillStyle = 'white';
    paint.beginPath();
    paint.arc(x, -20, 18, 0, Math.PI * 2);
    paint.fill();

    // 瞳孔
    paint.fillStyle = soundRatio > 0.4 ? '#8b0000' : '#24493e';
    paint.beginPath();
    const pupilRadius = soundRatio > 0.4 ? 5 : 8; // 聲音大時瞳孔縮小
    paint.arc(x + Math.sin(t/1000)*3, -19, pupilRadius, 0, Math.PI * 2);
    paint.fill();
  }

  // 嘴巴
  paint.strokeStyle = '#355d4b';
  paint.lineWidth = 4;
  paint.beginPath();
  if(soundRatio > 0.4 || g.state === 'scared') {
    // 嚇到／大聲時呈現驚嚇 O 型嘴
    paint.arc(0, 10, 12, 0, Math.PI * 2);
  } else {
    // 微笑嘴型
    paint.arc(0, 5, 17, 0, Math.PI);
  }
  paint.stroke();

  paint.restore();

  // 頂部狀態提醒
  paint.font='24px system-ui';
  paint.textAlign='center';
  if(soundRatio > 0.4) {
    paint.fillStyle='#c0392b';
    paint.fillText('警告：音量超過 40%！', 450, 65);
  } else {
    paint.fillStyle='#355e54';
    paint.fillText('慢慢靠近，輕聲說話', 450, 65);
  }
}

const $=id=>document.getElementById(id),params={...defaults},voice=new VoiceControl();
const canvas=$('scene'),paint=canvas.getContext('2d');canvas.width=900;canvas.height=600;
let context=null,stream=null,source=null,analyser=null,samples=null,session=0,running=false,pending=false,held=false,pulseUntil=0,debug=true,last=null,lastUi=0,calibration=null;
let game=makeGame();

// 提示音發聲器（功能 3：音量超過40%發出提示音）
let warningOsc=null, warningGain=null;

function initAudioContext() {
  if (!context) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) context = new AudioCtx();
  }
  if (context && context.state === 'suspended') {
    context.resume();
  }
  if (context && !warningOsc) {
    try {
      warningOsc = context.createOscillator();
      warningGain = context.createGain();
      warningOsc.type = 'sawtooth';
      warningOsc.frequency.setValueAtTime(520, context.currentTime);
      warningGain.gain.setValueAtTime(0, context.currentTime);
      warningOsc.connect(warningGain);
      warningGain.connect(context.destination);
      warningOsc.start();
    } catch(e) {
      console.warn('AudioContext warning sound init error:', e);
    }
  }
}

// 功能 3：更新警示音發聲狀態
function updateWarningBeep(rawVolume) {
  if (rawVolume > 40) {
    initAudioContext();
    if (warningGain && context) {
      // 計算超出 40% 的比例 (0 ~ 1)
      const ratio = clamp((rawVolume - 40) / 60, 0, 1);
      // 音量與接收音量成正比 (最大輸出 Gain 設為 0.35 避免過刺耳)
      const targetGain = ratio * 0.35;
      const targetFreq = 480 + ratio * 360; // 音高隨音量同步上升 (480Hz ~ 840Hz)
      warningGain.gain.setTargetAtTime(targetGain, context.currentTime, 0.02);
      warningOsc.frequency.setTargetAtTime(targetFreq, context.currentTime, 0.02);
    }
  } else {
    if (warningGain && context) {
      warningGain.gain.setTargetAtTime(0, context.currentTime, 0.02);
    }
  }
}

function zero(){held=false;pulseUntil=0;$('sim').value=0;$('simValue').textContent='0';}
function stop(message='已停止麥克風。'){session++;running=false;pending=false;calibration=null;if(stream){stream.getTracks().forEach(t=>{t.onended=null;t.onmute=null;t.stop();});stream=null;}if(source){source.disconnect();source=null;}if(warningGain && context){warningGain.gain.setTargetAtTime(0, context.currentTime, 0.01);}analyser=null;voice.reset();zero();$('status').textContent=message;controls();}
function controls(){const mode=$('input').value;for(const id of ['start'])$(id).disabled=mode!=='mic'||running||pending;$('stop').disabled=!running&&!pending;$('calibrate').disabled=!running||!!calibration;$('sim').disabled=mode!=='slider';$('keyLevel').disabled=mode==='mic';$('pulse').disabled=mode==='mic';for(const id of ['quiet','sound','burst'])$(id).disabled=!!calibration;}
function configure(changed){let q=+$('quiet').value,s=+$('sound').value;if(s-q<5){if(changed==='sound')q=s-5;else s=q+5;}$('quiet').value=q;$('sound').value=s;for(const id of ['quiet','sound','burst']){params[id]=+$(id).value;$(id+'Value').textContent=params[id];}$('quietLine').style.left=q+'\%';$('soundLine').style.left=s+'%';voice.reset();}

// 功能 4：真實麥克風驅動與擷取
async function start(){
  if(running||pending||$('input').value!=='mic')return;
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
    $('status').textContent='麥克風不可用，請使用 HTTPS／localhost 或切換模擬輸入。';
    return;
  }
  initAudioContext();
  const id=++session;
  pending=true;
  controls();
  $('status').textContent='請允許麥克風權限...';
  try{
    await context.resume();
    if(id!==session)return;
    const incoming=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:{ideal:false},noiseSuppression:{ideal:false},autoGainControl:{ideal:false}},
      video:false
    });
    if(id!==session){incoming.getTracks().forEach(t=>t.stop());return;}
    stream=incoming;
    source=context.createMediaStreamSource(incoming);
    analyser=context.createAnalyser();
    analyser.fftSize=1024;
    source.connect(analyser);
    samples=new Float32Array(analyser.fftSize);
    const track=incoming.getAudioTracks()[0];
    track.onended=()=>{if(id===session)stop('麥克風中斷，請重新啟用。');};
    track.onmute=()=>{if(id===session)stop('麥克風暫時無聲，已停止擷取。');};
    running=true;
    pending=false;
    voice.reset();
    controls();
    $('status').textContent='正在接收麥克風音量，僅在本地分析。';
  }catch(e){
    if(id!==session)return;
    stop(e.name==='NotAllowedError'?'麥克風權限被拒絕，請改用模擬輸入。':'麥克風啟用失敗，請改用模擬輸入。');
  }
}

function inputLevel(t){
  const mode=$('input').value;
  if(mode==='mic'){
    if(!running||!analyser||!samples)return 0;
    analyser.getFloatTimeDomainData(samples);
    let sum=0;
    for(const x of samples)sum+=x*x;
    const rms=Math.sqrt(sum/samples.length);
    return clamp(((rms>0?20*Math.log10(rms):-Infinity)+60)/60*100,0,100);
  }
  const base=mode==='keyboard'?(held?+$('keyLevel').value:0):+$('sim').value;
  return t<pulseUntil?Math.max(base,+$('keyLevel').value):base;
}

function frame(t){
  const dt=last===null?0:clamp((t-last)/1000,0,.05);
  last=t;
  const raw=inputLevel(t);

  // 功能 3：檢查並更新警示提示音
  updateWarningBeep(raw);

  let r;
  if(calibration){
    calibration.values.push(raw);
    $('status').textContent='背景音測量 '+Math.min(3,(t-calibration.start)/1000).toFixed(1)+'／3 秒，請保持安靜。';
    r={sounding:false,event:false,volume:raw,rise:0};
    if(t-calibration.start>=3000){
      const values=calibration.values.sort((a,b)=>a-b),base=values[Math.floor((values.length-1)*.9)];
      $('quiet').value=Math.min(90,Math.ceil(base+6));$('sound').value=Math.min(100,Math.ceil(base+18));
      calibration=null;configure('sound');controls();
      $('status').textContent='門檻已更新，請試玩後再微調。'+(base>=80?'背景偏高，建議調整位置或設備增益。':'');
    }
  } else {
    r=voice.tick(raw,t,params);
  }

  updateGame(game,r,raw,dt,t);
  drawGame(game,t,raw);

  if(debug&&t-lastUi>=90){
    lastUi=t;
    $('volume').textContent=Math.round(raw);$('fill').style.width=raw+'%';
    if(raw > 40) $('fill').classList.add('over-limit');
    else $('fill').classList.remove('over-limit');$('gateState').textContent=r.sounding?'發聲':'安靜';
    $('alertState').textContent=raw>40?`發出提示音 (${Math.round((raw-40)/60*100)}%)`:'正常';
    $('count').textContent=game.count;
  }
  $('gameState').textContent=game.message;
  requestAnimationFrame(frame);
}

// 功能 2：空白鍵切換除錯模式和遊戲模式
document.addEventListener('keydown',e=>{
  const isEditable = e.target instanceof Element && (e.target.isContentEditable || e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text'));
  
  if(e.code==='Space' && !isEditable){
    e.preventDefault();
    if(e.repeat)return;
    debug=!debug;
    document.body.classList.toggle('play',!debug);
    $('debug').hidden=!debug;
    
    // 清除控制項焦點，防止後續空白鍵重覆觸發按鈕
    if(document.activeElement && document.activeElement instanceof HTMLElement){
      document.activeElement.blur();
    }
    $('stage').focus({preventScroll:true});
  }else if(e.code==='ArrowUp'&&$('input').value==='keyboard'){
    e.preventDefault();
    held=true;
  }
});

document.addEventListener('keyup',e=>{if(e.code==='ArrowUp')held=false;});
$('stage').addEventListener('click',()=>{
  initAudioContext();
  $('stage').focus({preventScroll:true});
});

$('input').addEventListener('change',()=>{
  stop('已切換輸入，先點遊戲區域再操作。');
  controls();
  if($('input').value==='mic') {
    start();
  }
});

$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>stop());

for(const id of ['quiet','sound','burst'])$(id).addEventListener('input',()=>configure(id));
for(const id of ['sim','keyLevel'])$(id).addEventListener('input',()=>{$(id+'Value').textContent=$(id).value;});

$('pulse').addEventListener('click',()=>{pulseUntil=performance.now()+220;});$('zero').addEventListener('click',zero);
$('reset').addEventListener('click',()=>{zero();voice.reset();game=makeGame();});$('calibrate').addEventListener('click',()=>{if(!running)return;voice.reset();calibration={start:performance.now(),values:[]};controls();});

window.addEventListener('blur',()=>{zero();voice.reset();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop('頁面切至背景，麥克風已暫停。');last=null;pauseGame(game);}});
window.addEventListener('pagehide',()=>stop());

configure();controls();requestAnimationFrame(frame);
</script>
</body>
</html>
